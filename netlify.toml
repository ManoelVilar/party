# Netlify: publica a raiz do repositório (o jogo é o index.html).
[build]
  publish = "."
  # Sem etapa de build: o index.html já vem gerado. Para gerar no deploy, use:  command = "node scripts/build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Câmera, microfone e captura de tela só para o próprio site; o resto desligado.
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()"
    # MODO RELATÓRIO: não bloqueia nada, só registra violações no console (F12). Depois de abrir o jogo
    # e usar câmera, tela, YouTube e PDF sem avisos "[Report Only]", troque o nome do cabeçalho para
    # "Content-Security-Policy" para passar a bloquear de verdade.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.youtube.com https://s.ytimg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob: data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://*.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; base-uri 'none'; form-action 'none'; object-src 'none'"

# O HTML nunca fica em cache: quem abre o link sempre recebe a versão mais nova.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
